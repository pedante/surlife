name: M2.0 persistent ecology replay

on:
  pull_request:
  push:
    branches: [main]

jobs:
  persistent-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic offline tests
        run: python -m pip install -e '.[test]'
      - name: Test persistent ecology/referee invariants
        run: pytest -q tests/test_m20.py
      - name: Paired mirrored-policy ecology smoke
        run: |
          surlife --m20 --provider fake --seed 17 --ticks 24 --m20-a steward --m20-b extractive --benchmark-out out/m20-ci.json
          surlife --verify-m20-file out/m20-ci.json

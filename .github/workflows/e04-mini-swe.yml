name: E04-G01 mini-SWE-agent actual-core evaluation (offline)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mini-swe-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      MSWEA_SILENT_STARTUP: "1"
      MSWEA_GLOBAL_CONFIG_DIR: "/tmp/surlife-e04-mini-swe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native Surlife and pytest
        run: python -m pip install -e '.[test]'
      - name: Install genuine pinned mini-SWE-agent core without model SDK providers
        run: |
          python -m pip install --no-deps mini-swe-agent==2.4.6
          python -m pip install 'pydantic>=2,<3' 'jinja2>=3' 'rich>=13' 'python-dotenv>=1' 'platformdirs>=3'
      - name: Print installed upstream and narrow core dependencies
        run: python -m pip show mini-swe-agent pydantic jinja2 rich python-dotenv platformdirs
      - name: Run real DefaultAgent control-loop and security tests
        run: pytest -q tests/test_mini_swe.py
      - name: Compare CPU decision overhead to native scripted policy
        run: python -m surlife.mini_swe_benchmark

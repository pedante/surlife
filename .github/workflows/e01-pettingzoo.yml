name: E01-W02 PettingZoo optional adapter evaluation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pettingzoo-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional PettingZoo and pytest
        run: python -m pip install -e '.[pettingzoo,test]'
      - name: Show exact resolved dependencies
        run: python -m pip show pettingzoo gymnasium numpy typing_extensions
      - name: Run upstream API checker and native equivalence tests
        run: pytest -q tests/test_pettingzoo.py
      - name: Compare bare native arena and PettingZoo wrapper
        run: python -m surlife.pettingzoo_benchmark --repeats 9 --ticks 12

name: M0 Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-m0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependency
        run: python -m pip install -e '.[test]'
      - name: Unit and replay tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          surlife --seed 7 --ticks 12 --db out/ci.sqlite --run-id smoke
          surlife --db out/ci.sqlite --replay smoke
          surlife --multi --population 8 --population-arena task-duel --population-brains greedy,optimal,random,wait --provider fake --seed 17 --ticks 24 --benchmark-out out/population-ci.json
          surlife --verify-population-file out/population-ci.json
          surlife --multi --population 2 --population-arena legacy-m20 --population-brains steward,extractive --provider fake --seed 17 --ticks 16 --benchmark-out out/population-m20-ci.json
          surlife --verify-population-file out/population-m20-ci.json

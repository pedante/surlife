name: M2.1-C paired response bank and gateway gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  m21c-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tests without providers
        run: python -m pip install -e '.[test]'
      - name: All M2.1 tests: no real network or keys
        run: pytest -q tests/test_m21.py tests/test_m21c.py
      - name: Offline response-bank smoke
        run: |
          surlife --m21c --provider fake --seed 17 --ticks 24 --max-requests 8 --benchmark-out out/m21c-fixture-ci.json
          surlife --verify-m21c-file out/m21c-fixture-ci.json

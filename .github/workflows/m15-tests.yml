name: M1.5 Gemini adapter and benchmark

on:
  pull_request:
  push:
    branches: [main]

jobs:
  m15-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional SDK and test framework
        run: python -m pip install -e '.[gemini,test]'
      - name: Validate SDK availability and offline adapter tests
        run: |
          python -c 'from google import genai; assert hasattr(genai.Client, "interactions") or hasattr(genai.Client(api_key="DUMMY"), "interactions")'
          pytest -q tests/test_m15.py
      - name: Gemini model check without API usage
        run: surlife --provider google --check-model
      - name: Offline fake benchmark regression
        run: |
          surlife --m14 --a llm --b greedy --provider fake --seed 17 --benchmark-cases 2 --benchmark-items 12 --max-requests 1 --benchmark-out out/m15-ci.json
          surlife --verify-benchmark-file out/m15-ci.json

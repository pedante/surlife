name: M1.10 shared-bank TaskPack cognition

on:
  pull_request:
  push:
    branches: [main]

jobs:
  taskpack-cognition-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic offline test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check M1.10 replay and cognition experiments
        run: pytest -q tests/test_m110.py
      - name: Collect a fake-provider mixed TaskPack bank
        run: |
          surlife --m110 --provider fake --a llm --b greedy --seed 17 --benchmark-cases 4 --benchmark-items 9 --m110-pack mixed --max-requests 4 --m110-virtual-cap 4 --benchmark-out out/m110-ci.json
          surlife --verify-m110-file out/m110-ci.json
      - name: Reuse the exact bank with fewer virtual model calls
        run: |
          surlife --m110 --provider fake --a llm --b greedy --seed 17 --benchmark-cases 4 --benchmark-items 9 --m110-pack mixed --max-requests 4 --m110-virtual-cap 1 --m110-bank-in out/m110-ci.json --benchmark-out out/m110-reuse-ci.json
          surlife --verify-m110-file out/m110-reuse-ci.json

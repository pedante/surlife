name: M1 free-provider offline tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  m1-fake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run all tests without API keys
        run: pytest -q
      - name: Fake-provider smoke and replay
        run: |
          surlife --a llm --b greedy --provider fake --max-requests 4 --ticks 8 --db out/m1-ci.sqlite --run-id ci-m1
          surlife --replay ci-m1 --db out/m1-ci.sqlite

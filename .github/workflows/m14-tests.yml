name: M1.4 headroom benchmark and replay

on:
  pull_request:
  push:
    branches: [main]

jobs:
  m14-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: M1.4 deterministic benchmark and audit tests
        run: pytest -q tests/test_m14.py
      - name: Offline 12-task benchmark with fake provider and verified replay
        run: |
          surlife --m14 --a llm --b greedy --provider fake --seed 17 --benchmark-cases 12 --benchmark-items 12 --benchmark-profile mixed --cognition selective --max-requests 8 --benchmark-out out/m14-ci.json
          surlife --verify-benchmark-file out/m14-ci.json
      - name: Verify no-inference baseline
        run: |
          surlife --m14 --a llm --b greedy --provider fake --seed 17 --benchmark-cases 12 --benchmark-items 12 --cognition never

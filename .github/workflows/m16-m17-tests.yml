name: M1.6–M1.7 adaptive cognition and inheritance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  adaptive-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic offline dependencies
        run: python -m pip install -e '.[test]'
      - name: Run M1.6 and M1.7 tests
        run: pytest -q tests/test_m16_m17.py
      - name: M1.6 offline replay smoke
        run: |
          surlife --m16 --a llm --b greedy --provider fake --seed 17 --benchmark-cases 3 --max-requests 2 --benchmark-out out/m16-ci.json
          surlife --verify-adaptive-file out/m16-ci.json
      - name: M1.7 offline holdout gate smoke
        run: |
          surlife --m17 --a llm --b greedy --provider fake --train-report out/m16-ci.json --holdout-seeds 101,103 --benchmark-cases 3 --max-requests 2 --benchmark-out out/m17-ci.json
          surlife --verify-m17-file out/m17-ci.json

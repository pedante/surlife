name: M1.1 reflection and evaluated soul tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  m11-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Offline unit, lifecycle and replay tests
        run: pytest -q tests/test_m11.py
      - name: Stage a proposal and replay without any API key
        run: |
          surlife --m11 --seed 11 --ticks 8 --a llm --b greedy --provider fake --max-requests 8 --cognition selective --run-id ci-m11 --db out/m11-ci.sqlite --souls-dir out/m11-ci-souls
          surlife --replay ci-m11 --db out/m11-ci.sqlite
      - name: Evaluate the proposed soul with fake matched tasks
        run: |
          surlife --evaluate-soul out/m11-ci-souls/ci-m11/a.json --provider fake --evaluation-seed 1009 --evaluation-tasks 2
